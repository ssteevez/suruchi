<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilgrim — Suruchi Choksi</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        font-family: "Neue Haas Grotesk Text Pro", "Suisse Intl", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  
    <style>
      .global-home-btn {
        position: fixed;
        top: 36px;
        left: 36px;
        width: 32px;
        height: 32px;
        color: rgba(245, 245, 245, 0.6);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 180ms ease, opacity 180ms ease, transform 180ms ease;
      }
      .global-home-btn:hover {
        color: white;
        opacity: 1;
        transform: scale(1.05);
      }
      .global-home-btn svg {
        width: 20px;
        height: 20px;
      }
    </style>
</head>
  <body>

    <a href="/" class="global-home-btn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </a>

    <div id="root"></div>
    <script type="module" src="/src/pilgrim/main.tsx"></script>
  </body>
</html>
