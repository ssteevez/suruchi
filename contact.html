<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Suruchi Choksi</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #050506;
        color: rgba(245, 245, 245, 0.86);
        font-family: "Neue Haas Grotesk Text Pro", "Suisse Intl", "Avenir Next",
          "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.08em;
      }

      .home {
        position: absolute;
        top: 64px;
        left: 84px;
        color: rgba(245, 245, 245, 0.82);
        font-size: 68px;
        font-weight: 400;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: opacity 180ms ease;
        z-index: 100;
      }
      .home a {
        display: inline-block;
        border-bottom: 2px solid currentColor;
        padding-bottom: 2px;
        margin-bottom: 3px;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: color 180ms ease, opacity 180ms ease;
      }
      .home a:hover {
        color: white;
        opacity: 0.8;
      }

      .home:hover {
        opacity: 1;
      }

      main {
        width: 100%;
        max-width: none;
        padding: 380px clamp(24px, 4vw, 100px) 160px 84px;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }

      .contact-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(20px, 4vw, 40px);
        width: 100%;
        height: 100%;
      }

      @media (min-width: 900px) {
        .contact-grid {
          grid-template-columns: 1fr 1fr;
        }

        .header-info {
          grid-column: 2;
          grid-row: 1;
        }

        .form-section {
          grid-column: 1;
          grid-row: 1;
        }
      }

      .form-section {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .header-info {
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .header-info h1 {
        font-size: clamp(42px, 5vw, 84px);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: clamp(16px, 2vw, 32px);
      }

      form {
        display: flex;
        flex-direction: column;
        max-width: 1000px;
        width: 100%;
        flex: 1;
        min-height: 0;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 1vw, 12px);
        margin-bottom: clamp(16px, 2vw, 32px);
      }

      .form-group-message {
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 1vw, 12px);
        margin-bottom: clamp(16px, 2vw, 32px);
        flex: 1;
        min-height: 0;
      }

      label {
        font-size: clamp(12px, 1.2vw, 16px);
        color: rgba(245, 245, 245, 0.6);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      input, textarea {
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(245, 245, 245, 0.2);
        color: rgba(245, 245, 245, 0.96);
        font-family: inherit;
        font-size: clamp(14px, 1.5vw, 20px);
        padding: clamp(6px, 1vw, 12px) 0;
        outline: none;
        transition: border-color 200ms ease;
      }

      input::placeholder,
      textarea::placeholder {
        color: rgba(245, 245, 245, 0.15);
      }

      input:focus, textarea:focus {
        border-color: rgba(245, 245, 245, 0.8);
      }

      /* Add visual feedback for invalid fields when trying to type/submit */
      input:invalid:not(:focus):not(:placeholder-shown),
      textarea:invalid:not(:focus):not(:placeholder-shown) {
        border-bottom-color: #ff6b6b;
      }

      textarea {
        flex: 1;
        resize: none;
        min-height: 60px;
        box-sizing: border-box;
      }

      .intro-text {
        font-size: clamp(16px, 2vw, 24px);
        font-weight: 300;
        color: rgba(245, 245, 245, 0.8);
        margin-bottom: clamp(24px, 4vw, 48px);
        line-height: 1.4;
      }

      button {
        background: transparent;
        color: rgba(245, 245, 245, 0.86);
        border: 1px solid rgba(245, 245, 245, 0.3);
        padding: clamp(12px, 1.5vw, 20px) clamp(24px, 3vw, 40px);
        font-family: inherit;
        font-size: clamp(12px, 1.2vw, 16px);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        cursor: pointer;
        transition: all 200ms ease;
        align-self: flex-start;
      }

      button:hover {
        border-color: rgba(245, 245, 245, 0.9);
        color: #fff;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .success-message {
        display: none;
        font-size: clamp(24px, 4vw, 64px);
        font-weight: 300;
        line-height: 1.4;
        color: rgba(245, 245, 245, 0.9);
        max-width: 1200px;
      }

      .error-message {
        display: none;
        background: rgba(255, 107, 107, 0.1);
        border-left: 4px solid #ff6b6b;
        color: #ff6b6b;
        padding: 16px;
        margin-top: 24px;
        font-size: clamp(14px, 1.5vw, 18px);
        font-weight: 500;
        border-radius: 2px;
      }

      /* Contact Details Styling */
      .contact-details {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: clamp(14px, 1.2vw, 18px);
        color: rgba(245, 245, 245, 0.7);
        line-height: 1.6;
        margin-top: 16px;
      }

      .contact-details a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(245, 245, 245, 0.2);
        transition: border-color 200ms ease, color 200ms ease;
      }

      .contact-details a:hover {
        color: rgba(245, 245, 245, 0.96);
        border-color: rgba(245, 245, 245, 0.6);
      }

      .social-icons {
        display: flex;
        gap: 20px;
        margin-top: 8px;
        justify-content: flex-end;
      }

      .social-icons a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        color: rgba(245, 245, 245, 0.7);
        transition: color 200ms ease, transform 200ms ease;
      }

      .social-icons a:hover {
        color: rgba(245, 245, 245, 1);
        transform: translateY(-2px);
      }

      .social-icons svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
    </style>
  
    <style>
      .global-home-btn {
        position: fixed;
        top: 36px;
        left: 36px;
        width: 32px;
        height: 32px;
        color: rgba(245, 245, 245, 0.6);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 180ms ease, opacity 180ms ease, transform 180ms ease;
      }
      .global-home-btn:hover {
        color: white;
        opacity: 1;
        transform: scale(1.05);
      }
      .global-home-btn svg {
        width: 20px;
        height: 20px;
      }
    </style>
</head>
  <body>

    <a href="/" class="global-home-btn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </a>

    <div class="home">
      <a href="/">SURUCHI</a><br>
      <a href="/">CHOKSI</a>
    </div>
    
    <main>
      <div class="contact-grid">
        <header class="header-info">
          <h1>Contact</h1>
          <div class="contact-details">
            <div><a href="mailto:suruchi.choksi@gmail.com">suruchi.choksi@gmail.com</a></div>
            <div><a href="tel:+919820045725">+91 98200 45725</a></div>
            <div><a href="https://www.suruchichoksi.com" target="_blank" rel="noopener noreferrer">www.suruchichoksi.com</a></div>
            <div class="social-icons">
              <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              </a>
              <a href="#" aria-label="Facebook">
                <svg viewBox="0 0 24 24"><path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/></svg>
              </a>
              <a href="#" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24"><path d="M4.98 3.5c0 1.381-1.11 2.5-2.48 2.5s-2.48-1.119-2.48-2.5c0-1.38 1.11-2.5 2.48-2.5s2.48 1.12 2.48 2.5zm.02 4.5h-5v16h5v-16zm7.982 0h-4.968v16h4.969v-8.399c0-4.67 6.029-5.052 6.029 0v8.399h4.988v-10.131c0-7.88-8.922-7.593-11.018-3.714v-2.155z"/></svg>
              </a>
            </div>
          </div>
        </header>

        <div class="form-section">
          <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="contact" />
            <p style="display: none;">
              <label>Don't fill this out if you're human: <input name="bot-field" /></label>
            </p>

            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="(Enter your name)" required />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="(Enter your email)" required />
            </div>

            <div class="form-group-message">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="(Write your message here)" required></textarea>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
            <div class="error-message" id="error-message">Something went wrong. Please try again.</div>
          </form>

          <div class="success-message" id="success-message">
            Thank you, your message has been sent.
          </div>
        </div>
      </div>
    </main>

    <script>
      const form = document.getElementById('contact-form');
      const submitBtn = document.getElementById('submit-btn');
      const successMessage = document.getElementById('success-message');
      const errorMessage = document.getElementById('error-message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
        errorMessage.style.display = 'none';

        const formData = new FormData(form);

        try {
          // Detect if we are on localhost/dev. Netlify Forms won't catch this locally.
          const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          
          if (isLocalhost) {
            // Mock the network request delay so you can see the UI transition
            await new Promise(resolve => setTimeout(resolve, 800));
            // Simulate success
            form.style.display = 'none';
            successMessage.style.display = 'block';
            return;
          }

          const response = await fetch('/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams(formData).toString()
          });

          if (response.ok) {
            form.style.display = 'none';
            successMessage.style.display = 'block';
          } else {
            throw new Error('Network response was not ok');
          }
        } catch (error) {
          console.error('Form submission error:', error);
          errorMessage.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Message';
        }
      });
    </script>
  </body>
</html>
