<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photograms Prototype — Suruchi Choksi</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: #050506; overflow: hidden; }
      #root { width: 100%; height: 100%; }
      
      .back-btn {
        position: fixed;
        bottom: 30px;
        left: 30px;
        color: rgba(245, 245, 245, 0.7);
        font-family: "Neue Haas Grotesk Text Pro", "Suisse Intl", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-decoration: underline;
        padding: 8px 0;
        transition: color 180ms ease, opacity 180ms ease;
        z-index: 100;
      }
      .back-btn:hover {
        color: rgba(245, 245, 245, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a class="back-btn" href="/painter.html">BACK</a>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
