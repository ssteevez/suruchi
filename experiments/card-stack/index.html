<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Engine Experiment</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #111;
        overflow: hidden; /* No native scroll */
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        pointer-events: none;
      }

      #error-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(100, 0, 0, 0.9);
        color: white;
        z-index: 99999;
        display: none;
        padding: 40px;
        font-family: monospace;
        white-space: pre-wrap;
        overflow-y: auto;
      }
    </style>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var el = document.getElementById('error-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText += 'Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\n\n' + (error ? error.stack : '');
        }
        return false;
      };
      window.addEventListener("unhandledrejection", function(event) {
        var el = document.getElementById('error-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText += 'Unhandled Promise: ' + event.reason + '\n\n' + (event.reason ? event.reason.stack : '');
        }
      });
    </script>
  
    <style>
            .global-home-btn {
        position: fixed;
        top: 36px;
        left: 36px;
        width: 32px;
        height: 32px;
        color: rgba(245, 245, 245, 0.6);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 180ms ease, opacity 180ms ease, transform 180ms ease;
      }
      .global-home-btn:hover {
        color: white;
        opacity: 1;
        transform: scale(1.05);
      }
      .global-home-btn svg {
        width: 20px;
        height: 20px;
      }
    </style>
</head>
  <body>

<a href="/" class="global-home-btn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </a>

    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/experiments/card-stack/main.tsx"></script>
  </body>
</html>
