<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Engine Experiment</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #111;
        overflow: hidden; /* No native scroll */
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        pointer-events: none;
      }

      #error-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(100, 0, 0, 0.9);
        color: white;
        z-index: 99999;
        display: none;
        padding: 40px;
        font-family: monospace;
        white-space: pre-wrap;
        overflow-y: auto;
      }
      .header-title {
        position: absolute;
        top: 76px;
        left: 84px;
        color: rgba(245, 245, 245, 0.82);
        font-size: 34px;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        z-index: 100;
        pointer-events: none;
      }
      .back-btn {
        position: fixed;
        bottom: 30px;
        left: 30px;
        color: rgba(245, 245, 245, 0.7);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-decoration: underline;
        padding: 8px 0;
        transition: color 180ms ease, opacity 180ms ease;
        z-index: 100;
        pointer-events: auto;
        font-family: "Neue Haas Grotesk Text Pro", "Suisse Intl", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }
      .back-btn:hover {
        color: white;
        opacity: 0.9;
      }
    </style>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var el = document.getElementById('error-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText += 'Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\n\n' + (error ? error.stack : '');
        }
        return false;
      };
      window.addEventListener("unhandledrejection", function(event) {
        var el = document.getElementById('error-overlay');
        if (el) {
          el.style.display = 'block';
          el.innerText += 'Unhandled Promise: ' + event.reason + '\n\n' + (event.reason ? event.reason.stack : '');
        }
      });
    </script>
  </head>
  <body>
    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
